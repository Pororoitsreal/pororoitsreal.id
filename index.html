<!DOCTYPE html>
<html lang="id">

<head>
    
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DompetKu — Catat Keuangan Pribadi</title>
    <!-- Konfigurasi PWA Manifest & Service Worker -->
    <link rel="manifest" href="./manifest.json">
    <meta name="theme-color" content="#0f172a">
    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('./sw.js')
                    .then((reg) => console.log('PWA Service Worker registered!', reg))
                    .catch((err) => console.log('Service Worker error:', err));
            });
        }
    </script>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            transition: background-color 0.3s ease, color 0.3s ease;
        }
        /* Custom Scrollbar */
        ::-webkit-scrollbar {
            width: 6px;
        }
        ::-webkit-scrollbar-track {
            background: transparent;
        }
        ::-webkit-scrollbar-thumb {
            background: #cbd5e1;
            border-radius: 9999px;
        }
        .dark ::-webkit-scrollbar-thumb {
            background: #334155;
        }
        @keyframes slideUp {
            from { opacity: 0; transform: translateY(12px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .animate-slide-up {
            animation: slideUp 0.25s ease-out forwards;
        }
    </style>
</head>
<body class="bg-slate-100 text-slate-800 min-h-screen antialiased pb-16 selection:bg-indigo-500 selection:text-white">

    <!-- Toast Notification Container -->
    <div id="toastContainer" class="fixed bottom-5 right-5 z-50 flex flex-col gap-2 pointer-events-none"></div>

    <!-- Top Navbar -->
    <header class="sticky top-0 z-30 backdrop-blur-md bg-white/80 dark:bg-slate-900/80 border-b border-slate-200/70 dark:border-slate-800 transition-colors">
        <div class="max-w-2xl mx-auto px-4 py-3.5 flex justify-between items-center gap-3">
            <div class="flex items-center gap-2.5">
                <div class="w-9 h-9 rounded-xl bg-gradient-to-tr from-indigo-600 to-violet-500 flex items-center justify-center text-white shadow-md shadow-indigo-500/25">
                    <i class="fa-solid fa-wallet text-sm"></i>
                </div>
                <div>
                    <h1 class="text-base font-extrabold tracking-tight text-slate-900 dark:text-white leading-none">DompetKu</h1>
                    <p class="text-[11px] font-medium text-slate-500 dark:text-slate-400 mt-0.5">Personal Finance Tracker</p>
                </div>
            </div>

            <!-- Action Buttons -->
            <div class="flex items-center gap-1.5">
                <button onclick="exportData()" class="bg-slate-100 hover:bg-slate-200 dark:bg-slate-800 dark:hover:bg-slate-700 text-slate-700 dark:text-slate-200 text-xs font-semibold px-3 py-2 rounded-xl transition flex items-center gap-1.5 cursor-pointer" title="Unduh file cadangan JSON">
                    <i class="fa-solid fa-cloud-arrow-down text-indigo-500"></i>
                    <span class="hidden sm:inline">Backup</span>
                </button>
                <label class="bg-slate-100 hover:bg-slate-200 dark:bg-slate-800 dark:hover:bg-slate-700 text-slate-700 dark:text-slate-200 text-xs font-semibold px-3 py-2 rounded-xl transition flex items-center gap-1.5 cursor-pointer" title="Muat data dari file JSON">
                    <i class="fa-solid fa-cloud-arrow-up text-emerald-500"></i>
                    <span class="hidden sm:inline">Impor</span>
                    <input type="file" id="importFileInput" accept=".json" onchange="importData(event)" class="hidden">
                </label>
                <button onclick="toggleDarkMode()" id="darkModeBtn" class="w-9 h-9 rounded-xl bg-slate-100 hover:bg-slate-200 dark:bg-slate-800 dark:hover:bg-slate-700 text-slate-600 dark:text-amber-400 flex items-center justify-center transition cursor-pointer" title="Ganti Tema">
                    <i class="fa-solid fa-moon text-xs"></i>
                </button>
            </div>
        </div>
    </header>

    <!-- Main Container -->
    <main class="max-w-2xl mx-auto px-4 mt-6 space-y-6">

        <!-- Hero Balance Card -->
        <section class="relative overflow-hidden rounded-3xl bg-gradient-to-br from-slate-900 via-indigo-950 to-violet-950 text-white p-6 sm:p-7 shadow-xl shadow-indigo-950/15">
            <!-- Decorative Glows -->
            <div class="absolute -right-10 -top-10 w-44 h-44 bg-indigo-500/20 rounded-full blur-2xl pointer-events-none"></div>
            <div class="absolute -left-10 -bottom-12 w-40 h-40 bg-emerald-500/15 rounded-full blur-2xl pointer-events-none"></div>

            <div class="relative z-10">
                <div class="flex items-center justify-between">
                    <span id="saldoLabel" class="text-xs font-semibold text-indigo-200/80 uppercase tracking-wider flex items-center gap-1.5">
                        <span class="w-2 h-2 rounded-full bg-emerald-400 animate-pulse"></span>
                        Saldo Bersih (Tahun Ini)
                    </span>
                    <button onclick="toggleHideBalance()" class="text-indigo-200/70 hover:text-white text-xs p-1 transition cursor-pointer" title="Sembunyikan/Tampilkan Saldo">
                        <i id="eyeIcon" class="fa-solid fa-eye"></i>
                    </button>
                </div>

                <h2 id="totalSaldo" class="text-3xl sm:text-4xl font-extrabold mt-2 tracking-tight">Rp 0</h2>

                <div class="grid grid-cols-2 gap-3 sm:gap-4 mt-6 pt-5 border-t border-white/10">
                    <div class="bg-white/5 backdrop-blur-sm rounded-2xl p-3.5 border border-white/5">
                        <div class="flex items-center gap-2 text-xs text-emerald-300 font-semibold">
                            <span class="w-6 h-6 rounded-lg bg-emerald-500/20 flex items-center justify-center">
                                <i class="fa-solid fa-arrow-trend-up text-[11px]"></i>
                            </span>
                            Pemasukan
                        </div>
                        <p id="totalPemasukan" class="text-base sm:text-lg font-bold mt-1.5 tracking-tight">Rp 0</p>
                    </div>

                    <div class="bg-white/5 backdrop-blur-sm rounded-2xl p-3.5 border border-white/5">
                        <div class="flex items-center gap-2 text-xs text-rose-300 font-semibold">
                            <span class="w-6 h-6 rounded-lg bg-rose-500/20 flex items-center justify-center">
                                <i class="fa-solid fa-arrow-trend-down text-[11px]"></i>
                            </span>
                            Pengeluaran
                        </div>
                        <p id="totalPengeluaran" class="text-base sm:text-lg font-bold mt-1.5 tracking-tight">Rp 0</p>
                    </div>
                </div>
            </div>
        </section>

        <!-- Form & Chart Grid -->
        <div class="grid grid-cols-1 md:grid-cols-12 gap-6">
            
            <!-- Form Tambah / Edit Transaksi -->
            <section class="md:col-span-7 bg-white dark:bg-slate-900 p-5 sm:p-6 rounded-3xl shadow-sm border border-slate-200/70 dark:border-slate-800 transition-colors">
                <div class="flex items-center justify-between mb-4">
                    <h3 id="formTitle" class="text-sm font-bold text-slate-900 dark:text-white flex items-center gap-2">
                        <span class="w-7 h-7 rounded-lg bg-indigo-50 dark:bg-indigo-500/10 text-indigo-600 dark:text-indigo-400 flex items-center justify-center">
                            <i class="fa-solid fa-plus text-xs"></i>
                        </span>
                        Tambah Transaksi
                    </h3>
                    <button type="button" id="cancelEditBtn" onclick="cancelEdit()" class="hidden text-xs font-semibold text-rose-500 hover:text-rose-600 cursor-pointer">
                        Batal Edit
                    </button>
                </div>

                <form id="transactionForm" onsubmit="handleFormSubmit(event)" class="space-y-4">
                    <!-- Jenis Transaksi Switch -->
                    <div class="grid grid-cols-2 gap-1.5 p-1 bg-slate-100 dark:bg-slate-800 rounded-2xl">
                        <button type="button" id="btnPemasukan" onclick="setJenis('Pemasukan')" class="py-2.5 text-xs font-bold rounded-xl transition flex items-center justify-center gap-1.5 cursor-pointer">
                            <i class="fa-solid fa-circle-arrow-down"></i> PEMASUKAN
                        </button>
                        <button type="button" id="btnPengeluaran" onclick="setJenis('Pengeluaran')" class="py-2.5 text-xs font-bold rounded-xl transition flex items-center justify-center gap-1.5 cursor-pointer">
                            <i class="fa-solid fa-circle-arrow-up"></i> PENGELUARAN
                        </button>
                    </div>

                    <div>
                        <label class="block text-xs font-semibold text-slate-600 dark:text-slate-400 mb-1.5">Nominal (Rp)</label>
                        <div class="relative">
                            <span class="absolute left-3.5 top-1/2 -translate-y-1/2 text-xs font-bold text-slate-400">Rp</span>
                            <input type="text" inputmode="numeric" id="nominal" required placeholder="0" oninput="formatNominalInput(this)" class="w-full pl-10 pr-4 py-2.5 text-sm font-bold bg-slate-50 dark:bg-slate-800/70 border border-slate-200 dark:border-slate-700 text-slate-900 dark:text-white rounded-xl focus:outline-none focus:ring-2 focus:ring-indigo-500 transition">
                        </div>
                    </div>

                    <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
                        <div>
                            <label class="block text-xs font-semibold text-slate-600 dark:text-slate-400 mb-1.5">Kategori</label>
                            <select id="kategori" class="w-full px-3.5 py-2.5 text-xs font-medium bg-slate-50 dark:bg-slate-800/70 border border-slate-200 dark:border-slate-700 text-slate-900 dark:text-white rounded-xl focus:outline-none focus:ring-2 focus:ring-indigo-500 transition">
                            </select>
                        </div>
                        <div>
                            <label class="block text-xs font-semibold text-slate-600 dark:text-slate-400 mb-1.5">Tanggal</label>
                            <input type="date" id="tanggal" required class="w-full px-3.5 py-2.5 text-xs font-medium bg-slate-50 dark:bg-slate-800/70 border border-slate-200 dark:border-slate-700 text-slate-900 dark:text-white rounded-xl focus:outline-none focus:ring-2 focus:ring-indigo-500 transition">
                        </div>
                    </div>

                    <div>
                        <label class="block text-xs font-semibold text-slate-600 dark:text-slate-400 mb-1.5">Catatan / Keterangan</label>
                        <input type="text" id="catatan" placeholder="Contoh: Kopi susu, Gaji bulanan..." class="w-full px-3.5 py-2.5 text-xs font-medium bg-slate-50 dark:bg-slate-800/70 border border-slate-200 dark:border-slate-700 text-slate-900 dark:text-white rounded-xl focus:outline-none focus:ring-2 focus:ring-indigo-500 transition">
                    </div>

                    <button type="submit" id="submitBtn" class="w-full py-3 bg-indigo-600 hover:bg-indigo-700 active:scale-[0.99] text-white font-bold rounded-xl text-xs tracking-wide transition shadow-lg shadow-indigo-600/20 cursor-pointer flex items-center justify-center gap-2">
                        <i class="fa-solid fa-check"></i> SIMPAN TRANSAKSI
                    </button>
                </form>
            </section>

            <!-- Ringkasan Grafik Kategori -->
            <section class="md:col-span-5 bg-white dark:bg-slate-900 p-5 sm:p-6 rounded-3xl shadow-sm border border-slate-200/70 dark:border-slate-800 flex flex-col justify-between transition-colors">
                <div class="flex items-center justify-between mb-2">
                    <h3 class="text-sm font-bold text-slate-900 dark:text-white flex items-center gap-2">
                        <span class="w-7 h-7 rounded-lg bg-violet-50 dark:bg-violet-500/10 text-violet-600 dark:text-violet-400 flex items-center justify-center">
                            <i class="fa-solid fa-chart-pie text-xs"></i>
                        </span>
                        Analisis Pengeluaran
                    </h3>
                </div>
                
                <div id="chartWrapper" class="relative my-auto py-3 flex items-center justify-center min-h-[190px]">
                    <canvas id="expenseChart"></canvas>
                    <div id="emptyChartState" class="hidden text-center text-xs text-slate-400 py-8">
                        <i class="fa-solid fa-chart-simple text-2xl mb-2 opacity-40 block"></i>
                        Belum ada data pengeluaran pada periode ini
                    </div>
                </div>

                <p id="chartFooterNote" class="text-[11px] text-center text-slate-400 dark:text-slate-500 mt-2">Proporsi pengeluaran berdasarkan filter aktif</p>
            </section>
        </div>

        <!-- Riwayat Transaksi & Filter -->
        <section class="bg-white dark:bg-slate-900 p-5 sm:p-6 rounded-3xl shadow-sm border border-slate-200/70 dark:border-slate-800 space-y-4 transition-colors">
            <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-3">
                <div>
                    <h3 class="text-sm font-bold text-slate-900 dark:text-white">Riwayat Transaksi</h3>
                    <p id="transactionCount" class="text-[11px] text-slate-500 dark:text-slate-400">0 transaksi ditemukan</p>
                </div>

                <!-- Filter Tab Tipe Transaksi -->
                <div class="flex gap-1 bg-slate-100 dark:bg-slate-800 p-1 rounded-xl text-xs font-semibold w-full sm:w-auto">
                    <button onclick="setFilter('Semua')" id="filterSemua" class="flex-1 sm:flex-none px-3 py-1.5 rounded-lg transition cursor-pointer">Semua</button>
                    <button onclick="setFilter('Pemasukan')" id="filterPemasukan" class="flex-1 sm:flex-none px-3 py-1.5 rounded-lg transition cursor-pointer">Masuk</button>
                    <button onclick="setFilter('Pengeluaran')" id="filterPengeluaran" class="flex-1 sm:flex-none px-3 py-1.5 rounded-lg transition cursor-pointer">Keluar</button>
                </div>
            </div>

            <!-- Filter Bar: Bulan, Tahun & Pencarian -->
            <div class="grid grid-cols-2 sm:grid-cols-12 gap-2.5 pt-2 border-t border-slate-100 dark:border-slate-800">
                <div class="col-span-1 sm:col-span-3">
                    <select id="filterBulan" onchange="renderApp()" class="w-full px-3 py-2 text-xs font-medium bg-slate-50 dark:bg-slate-800/70 border border-slate-200 dark:border-slate-700 text-slate-700 dark:text-slate-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-indigo-500">
                        <option value="Semua">Semua Bulan</option>
                        <option value="0">Januari</option>
                        <option value="1">Februari</option>
                        <option value="2">Maret</option>
                        <option value="3">April</option>
                        <option value="4">Mei</option>
                        <option value="5">Juni</option>
                        <option value="6">Juli</option>
                        <option value="7">Agustus</option>
                        <option value="8">September</option>
                        <option value="9">Oktober</option>
                        <option value="10">November</option>
                        <option value="11">Desember</option>
                    </select>
                </div>
                <div class="col-span-1 sm:col-span-3">
                    <select id="filterTahun" onchange="onYearFilterChange()" class="w-full px-3 py-2 text-xs font-medium bg-slate-50 dark:bg-slate-800/70 border border-slate-200 dark:border-slate-700 text-slate-700 dark:text-slate-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-indigo-500">
                        <!-- Options di-generate dinamis -->
                    </select>
                </div>
                <div class="col-span-2 sm:col-span-6 relative">
                    <i class="fa-solid fa-magnifying-glass text-slate-400 text-xs absolute left-3.5 top-1/2 -translate-y-1/2"></i>
                    <input type="text" id="searchQuery" oninput="renderApp()" placeholder="Cari catatan atau kategori..." class="w-full pl-9 pr-3.5 py-2 text-xs font-medium bg-slate-50 dark:bg-slate-800/70 border border-slate-200 dark:border-slate-700 text-slate-900 dark:text-white rounded-xl focus:outline-none focus:ring-2 focus:ring-indigo-500">
                </div>
            </div>

            <!-- List Catatan -->
            <div id="transactionList" class="space-y-2.5 max-h-[440px] overflow-y-auto pr-1">
                <!-- Data akan dimasukkan lewat JavaScript -->
            </div>
        </section>
    </main>

    <!-- Script Aplikasi -->
    <script>
        let currentJenis = 'Pengeluaran';
        let currentFilter = 'Semua';
        let editingId = null;
        let hideBalance = false;
        let expenseChartInstance = null;
        let transactions = JSON.parse(localStorage.getItem('dompetku_transactions')) || [];

        const kategoriPemasukan = ['Gaji', 'Bonus / Freelance', 'Investasi', 'Hadiah', 'Lain-lain'];
        const kategoriPengeluaran = ['Makanan & Minuman', 'Transportasi', 'Tagihan & Utilitas', 'Tarik Tunai ATM', 'Belanja', 'Hiburan', 'Kesehatan', 'Lain-lain'];

        // Mapping Ikon & Warna per Kategori
        const categoryMeta = {
            'Gaji': { icon: 'fa-briefcase', color: 'text-emerald-600 bg-emerald-100 dark:bg-emerald-500/20 dark:text-emerald-300', hex: '#10b981' },
            'Bonus / Freelance': { icon: 'fa-laptop-code', color: 'text-teal-600 bg-teal-100 dark:bg-teal-500/20 dark:text-teal-300', hex: '#14b8a6' },
            'Investasi': { icon: 'fa-chart-line', color: 'text-indigo-600 bg-indigo-100 dark:bg-indigo-500/20 dark:text-indigo-300', hex: '#6366f1' },
            'Hadiah': { icon: 'fa-gift', color: 'text-pink-600 bg-pink-100 dark:bg-pink-500/20 dark:text-pink-300', hex: '#ec4899' },
            'Makanan & Minuman': { icon: 'fa-utensils', color: 'text-orange-600 bg-orange-100 dark:bg-orange-500/20 dark:text-orange-300', hex: '#f97316' },
            'Transportasi': { icon: 'fa-car', color: 'text-sky-600 bg-sky-100 dark:bg-sky-500/20 dark:text-sky-300', hex: '#0ea5e9' },
            'Tagihan & Utilitas': { icon: 'fa-bolt', color: 'text-amber-600 bg-amber-100 dark:bg-amber-500/20 dark:text-amber-300', hex: '#f59e0b' },
            'Tarik Tunai ATM': { icon: 'fa-money-bill-wave', color: 'text-emerald-600 bg-emerald-100 dark:bg-emerald-500/20 dark:text-emerald-300', hex: '#10b981' },
            'Belanja': { icon: 'fa-bag-shopping', color: 'text-purple-600 bg-purple-100 dark:bg-purple-500/20 dark:text-purple-300', hex: '#a855f7' },
            'Hiburan': { icon: 'fa-gamepad', color: 'text-rose-600 bg-rose-100 dark:bg-rose-500/20 dark:text-rose-300', hex: '#f43f5e' },
            'Kesehatan': { icon: 'fa-heart-pulse', color: 'text-red-600 bg-red-100 dark:bg-red-500/20 dark:text-red-300', hex: '#ef4444' },
            'Lain-lain': { icon: 'fa-receipt', color: 'text-slate-600 bg-slate-200 dark:bg-slate-700 dark:text-slate-300', hex: '#64748b' }
        };

        // Dark Mode Init
        if (localStorage.getItem('dompetku_theme') === 'dark') {
            document.documentElement.classList.add('dark');
            document.body.classList.replace('bg-slate-100', 'bg-slate-950');
            document.getElementById('darkModeBtn').innerHTML = '<i class="fa-solid fa-sun text-xs"></i>';
        }

        function toggleDarkMode() {
            const html = document.documentElement;
            const isDark = html.classList.toggle('dark');
            if (isDark) {
                document.body.classList.replace('bg-slate-100', 'bg-slate-950');
                document.getElementById('darkModeBtn').innerHTML = '<i class="fa-solid fa-sun text-xs"></i>';
                localStorage.setItem('dompetku_theme', 'dark');
            } else {
                document.body.classList.replace('bg-slate-950', 'bg-slate-100');
                document.getElementById('darkModeBtn').innerHTML = '<i class="fa-solid fa-moon text-xs"></i>';
                localStorage.setItem('dompetku_theme', 'light');
            }
            renderApp();
        }

        function showToast(message, type = 'success') {
            const container = document.getElementById('toastContainer');
            const toast = document.createElement('div');
            const bg = type === 'success' ? 'bg-slate-900 dark:bg-indigo-600' : 'bg-rose-600';
            const icon = type === 'success' ? 'fa-circle-check text-emerald-400 dark:text-white' : 'fa-circle-exclamation text-white';

            toast.className = `${bg} text-white text-xs font-semibold px-4 py-3 rounded-2xl shadow-xl flex items-center gap-2.5 animate-slide-up pointer-events-auto`;
            toast.innerHTML = `<i class="fa-solid ${icon}"></i> <span>${message}</span>`;
            container.appendChild(toast);

            setTimeout(() => {
                toast.style.opacity = '0';
                toast.style.transform = 'translateY(8px)';
                toast.style.transition = 'all 0.25s ease';
                setTimeout(() => toast.remove(), 250);
            }, 2600);
        }

        function formatNominalInput(input) {
            let raw = input.value.replace(/\D/g, '');
            if (!raw) {
                input.value = '';
                return;
            }
            input.value = new Intl.NumberFormat('id-ID').format(parseInt(raw, 10));
        }

        function parseNominalInput(formattedStr) {
            return parseFloat(formattedStr.replace(/\./g, '')) || 0;
        }

        function toggleHideBalance() {
            hideBalance = !hideBalance;
            document.getElementById('eyeIcon').className = hideBalance ? 'fa-solid fa-eye-slash' : 'fa-solid fa-eye';
            renderApp();
        }

        // Set Tanggal Default Hari Ini
        document.getElementById('tanggal').valueAsDate = new Date();
        setJenis('Pengeluaran');
        setFilter('Semua');

        function initYearFilter() {
            const filterTahunSelect = document.getElementById('filterTahun');
            const years = [...new Set(transactions.map(tx => new Date(tx.tanggal).getFullYear()))];
            const thisYear = new Date().getFullYear();
            if (!years.includes(thisYear)) years.push(thisYear);
            years.sort((a, b) => b - a);

            filterTahunSelect.innerHTML = '';
            years.forEach(year => {
                const opt = document.createElement('option');
                opt.value = year;
                opt.textContent = `Tahun ${year}`;
                filterTahunSelect.appendChild(opt);
            });

            if ([...filterTahunSelect.options].some(o => o.value == thisYear)) {
                filterTahunSelect.value = thisYear;
            } else if (filterTahunSelect.options.length > 0) {
                filterTahunSelect.selectedIndex = 0;
            }
        }

        function populateYearFilter() {
            const filterTahunSelect = document.getElementById('filterTahun');
            const currentSelected = filterTahunSelect.value;
            const years = [...new Set(transactions.map(tx => new Date(tx.tanggal).getFullYear()))];
            const thisYear = new Date().getFullYear();
            if (!years.includes(thisYear)) years.push(thisYear);
            years.sort((a, b) => b - a);

            filterTahunSelect.innerHTML = '';
            years.forEach(year => {
                const opt = document.createElement('option');
                opt.value = year;
                opt.textContent = `Tahun ${year}`;
                filterTahunSelect.appendChild(opt);
            });

            if ([...filterTahunSelect.options].some(o => o.value === currentSelected)) {
                filterTahunSelect.value = currentSelected;
            }
        }

        function onYearFilterChange() {
            renderApp();
        }

        function setJenis(jenis) {
            currentJenis = jenis;
            const btnPemasukan = document.getElementById('btnPemasukan');
            const btnPengeluaran = document.getElementById('btnPengeluaran');

            if (jenis === 'Pemasukan') {
                btnPemasukan.className = "py-2.5 text-xs font-bold rounded-xl transition bg-white dark:bg-slate-900 text-emerald-600 dark:text-emerald-400 shadow-sm flex items-center justify-center gap-1.5 cursor-pointer";
                btnPengeluaran.className = "py-2.5 text-xs font-bold rounded-xl transition text-slate-500 dark:text-slate-400 hover:text-slate-900 dark:hover:text-white flex items-center justify-center gap-1.5 cursor-pointer";
            } else {
                btnPengeluaran.className = "py-2.5 text-xs font-bold rounded-xl transition bg-white dark:bg-slate-900 text-rose-600 dark:text-rose-400 shadow-sm flex items-center justify-center gap-1.5 cursor-pointer";
                btnPemasukan.className = "py-2.5 text-xs font-bold rounded-xl transition text-slate-500 dark:text-slate-400 hover:text-slate-900 dark:hover:text-white flex items-center justify-center gap-1.5 cursor-pointer";
            }
            updateKategoriDropdown();
        }

        function updateKategoriDropdown() {
            const select = document.getElementById('kategori');
            select.innerHTML = '';
            const list = currentJenis === 'Pemasukan' ? kategoriPemasukan : kategoriPengeluaran;
            list.forEach(kat => {
                const opt = document.createElement('option');
                opt.value = kat;
                opt.textContent = kat;
                select.appendChild(opt);
            });
        }

        function setFilter(filter) {
            currentFilter = filter;
            ['Semua', 'Pemasukan', 'Pengeluaran'].forEach(f => {
                const el = document.getElementById(`filter${f}`);
                if (f === filter) {
                    el.className = "flex-1 sm:flex-none px-3 py-1.5 rounded-lg bg-white dark:bg-slate-900 shadow-sm text-slate-900 dark:text-white transition cursor-pointer";
                } else {
                    el.className = "flex-1 sm:flex-none px-3 py-1.5 rounded-lg text-slate-600 dark:text-slate-400 hover:text-slate-900 dark:hover:text-white transition cursor-pointer";
                }
            });
            renderApp();
        }

        function handleFormSubmit(e) {
            e.preventDefault();
            const nominal = parseNominalInput(document.getElementById('nominal').value);
            if (nominal <= 0) {
                showToast('Masukkan nominal yang valid!', 'error');
                return;
            }

            const kategori = document.getElementById('kategori').value;
            const tanggal = document.getElementById('tanggal').value;
            const catatan = document.getElementById('catatan').value.trim() || kategori;

            if (editingId) {
                transactions = transactions.map(tx => tx.id === editingId ? {
                    ...tx,
                    jenis: currentJenis,
                    nominal,
                    kategori,
                    tanggal,
                    catatan
                } : tx);
                showToast('Transaksi berhasil diperbarui!');
                cancelEdit();
            } else {
                const newTx = {
                    id: Date.now(),
                    jenis: currentJenis,
                    nominal,
                    kategori,
                    tanggal,
                    catatan
                };
                transactions.unshift(newTx);
                showToast('Transaksi berhasil ditambahkan!');
            }

            saveAndRender();
            document.getElementById('nominal').value = '';
            document.getElementById('catatan').value = '';
            document.getElementById('tanggal').valueAsDate = new Date();
        }

        function editTransaction(id) {
            const tx = transactions.find(t => t.id === id);
            if (!tx) return;

            editingId = id;
            setJenis(tx.jenis);
            document.getElementById('nominal').value = new Intl.NumberFormat('id-ID').format(tx.nominal);
            document.getElementById('kategori').value = tx.kategori;
            document.getElementById('tanggal').value = tx.tanggal;
            document.getElementById('catatan').value = tx.catatan === '-' ? '' : tx.catatan;

            document.getElementById('formTitle').innerHTML = `
                <span class="w-7 h-7 rounded-lg bg-amber-100 dark:bg-amber-500/20 text-amber-600 dark:text-amber-400 flex items-center justify-center">
                    <i class="fa-solid fa-pen text-xs"></i>
                </span>
                Edit Transaksi
            `;
            document.getElementById('submitBtn').innerHTML = '<i class="fa-solid fa-floppy-disk"></i> SIMPAN PERUBAHAN';
            document.getElementById('cancelEditBtn').classList.remove('hidden');
            document.getElementById('transactionForm').scrollIntoView({ behavior: 'smooth', block: 'center' });
        }

        function cancelEdit() {
            editingId = null;
            document.getElementById('formTitle').innerHTML = `
                <span class="w-7 h-7 rounded-lg bg-indigo-50 dark:bg-indigo-500/10 text-indigo-600 dark:text-indigo-400 flex items-center justify-center">
                    <i class="fa-solid fa-plus text-xs"></i>
                </span>
                Tambah Transaksi
            `;
            document.getElementById('submitBtn').innerHTML = '<i class="fa-solid fa-check"></i> SIMPAN TRANSAKSI';
            document.getElementById('cancelEditBtn').classList.add('hidden');
            document.getElementById('nominal').value = '';
            document.getElementById('catatan').value = '';
            document.getElementById('tanggal').valueAsDate = new Date();
        }

        function deleteTransaction(id) {
            if (confirm('Hapus catatan transaksi ini?')) {
                if (editingId === id) cancelEdit();
                transactions = transactions.filter(tx => tx.id !== id);
                saveAndRender();
                showToast('Transaksi dihapus.');
            }
        }

        function saveAndRender() {
            transactions.sort((a, b) => new Date(b.tanggal) - new Date(a.tanggal) || b.id - a.id);
            localStorage.setItem('dompetku_transactions', JSON.stringify(transactions));
            populateYearFilter();
            renderApp();
        }

        function formatRupiah(angka) {
            if (hideBalance) return 'Rp •••••••';
            return new Intl.NumberFormat('id-ID', { style: 'currency', currency: 'IDR', maximumFractionDigits: 0 }).format(angka);
        }

        function formatDate(dateString) {
            const options = { day: 'numeric', month: 'short', year: 'numeric' };
            return new Date(dateString).toLocaleDateString('id-ID', options);
        }

        function renderChart(filteredTransactions) {
            const expenses = filteredTransactions.filter(tx => tx.jenis === 'Pengeluaran');
            const canvas = document.getElementById('expenseChart');
            const emptyState = document.getElementById('emptyChartState');
            const selectedYear = document.getElementById('filterTahun').value;

            document.getElementById('chartFooterNote').textContent = `Proporsi pengeluaran tahun ${selectedYear}`;

            if (expenses.length === 0) {
                canvas.classList.add('hidden');
                emptyState.classList.remove('hidden');
                if (expenseChartInstance) {
                    expenseChartInstance.destroy();
                    expenseChartInstance = null;
                }
                return;
            }

            canvas.classList.remove('hidden');
            emptyState.classList.add('hidden');

            const grouped = {};
            let totalExpense = 0;
            expenses.forEach(tx => {
                grouped[tx.kategori] = (grouped[tx.kategori] || 0) + tx.nominal;
                totalExpense += tx.nominal;
            });

            // Urutkan kategori dari nominal terbesar ke terkecil
            const sortedEntries = Object.entries(grouped).sort((a, b) => b[1] - a[1]);
            
            const labels = sortedEntries.map(([kat, val]) => {
                const percentage = totalExpense > 0 ? ((val / totalExpense) * 100).toFixed(1) : 0;
                return `${kat} (${percentage}%)`;
            });
            const data = sortedEntries.map(([_, val]) => val);
            const colors = sortedEntries.map(([kat, _]) => (categoryMeta[kat] ? categoryMeta[kat].hex : '#6366f1'));
            const isDark = document.documentElement.classList.contains('dark');

            if (expenseChartInstance) {
                expenseChartInstance.destroy();
            }

            expenseChartInstance = new Chart(canvas, {
                type: 'doughnut',
                data: {
                    labels,
                    datasets: [{
                        data,
                        backgroundColor: colors,
                        borderWidth: 2,
                        borderColor: isDark ? '#0f172a' : '#ffffff',
                        hoverOffset: 6
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    cutout: '68%',
                    plugins: {
                        legend: {
                            position: 'bottom',
                            labels: {
                                boxWidth: 10,
                                boxHeight: 10,
                                usePointStyle: true,
                                pointStyle: 'circle',
                                padding: 12,
                                color: isDark ? '#cbd5e1' : '#475569',
                                font: { family: 'Plus Jakarta Sans', size: 11, weight: '600' }
                            }
                        },
                        tooltip: {
                            callbacks: {
                                label: function(ctx) {
                                    const val = ctx.raw;
                                    const percentage = totalExpense > 0 ? ((val / totalExpense) * 100).toFixed(1) : 0;
                                    const formattedVal = new Intl.NumberFormat('id-ID', { style: 'currency', currency: 'IDR', maximumFractionDigits: 0 }).format(val);
                                    return ` ${formattedVal} (${percentage}%)`;
                                }
                            }
                        }
                    }
                }
            });
        }

        function renderApp() {
            const listEl = document.getElementById('transactionList');
            const searchVal = document.getElementById('searchQuery').value.toLowerCase();
            const selectedMonth = document.getElementById('filterBulan').value;
            const selectedYear = document.getElementById('filterTahun').value;

            document.getElementById('saldoLabel').innerHTML = `
                <span class="w-2 h-2 rounded-full bg-emerald-400 animate-pulse"></span>
                Saldo Bersih (Tahun ${selectedYear})
            `;

            let yearFiltered = transactions.filter(tx => {
                const txDate = new Date(tx.tanggal);
                return txDate.getFullYear() === parseInt(selectedYear);
            });

            let periodFiltered = yearFiltered.filter(tx => {
                const txDate = new Date(tx.tanggal);
                const matchSearch = tx.catatan.toLowerCase().includes(searchVal) || tx.kategori.toLowerCase().includes(searchVal);
                const matchMonth = selectedMonth === 'Semua' || txDate.getMonth() === parseInt(selectedMonth);
                return matchSearch && matchMonth;
            });

            let filtered = periodFiltered.filter(tx => currentFilter === 'Semua' || tx.jenis === currentFilter);

            let totalP = 0;
            let totalK = 0;
            yearFiltered.forEach(tx => {
                if (tx.jenis === 'Pemasukan') totalP += tx.nominal;
                else totalK += tx.nominal;
            });
            let saldo = totalP - totalK;

            document.getElementById('totalSaldo').textContent = formatRupiah(saldo);
            document.getElementById('totalPemasukan').textContent = formatRupiah(totalP);
            document.getElementById('totalPengeluaran').textContent = formatRupiah(totalK);
            document.getElementById('transactionCount').textContent = `${filtered.length} transaksi ditampilkan`;

            renderChart(periodFiltered);

            if (filtered.length === 0) {
                listEl.innerHTML = `
                    <div class="py-12 text-center">
                        <div class="w-12 h-12 rounded-2xl bg-slate-100 dark:bg-slate-800 text-slate-400 flex items-center justify-center mx-auto mb-3">
                            <i class="fa-solid fa-folder-open text-lg"></i>
                        </div>
                        <p class="text-xs font-semibold text-slate-500 dark:text-slate-400">Belum ada catatan transaksi di tahun ${selectedYear}</p>
                        <p class="text-[11px] text-slate-400 dark:text-slate-500 mt-1">Ganti filter tahun di atas untuk melihat history tahun sebelumnya</p>
                    </div>`;
                return;
            }

            listEl.innerHTML = filtered.map(tx => {
                const isPemasukan = tx.jenis === 'Pemasukan';
                const meta = categoryMeta[tx.kategori] || categoryMeta['Lain-lain'];
                const sign = isPemasukan ? '+' : '-';
                const amountColor = isPemasukan ? 'text-emerald-600 dark:text-emerald-400' : 'text-slate-900 dark:text-white';

                return `
                    <div class="group p-3 rounded-2xl bg-slate-50/70 hover:bg-slate-100/90 dark:bg-slate-800/40 dark:hover:bg-slate-800/80 border border-transparent hover:border-slate-200/80 dark:hover:border-slate-700 transition flex items-center justify-between gap-3">
                        <div class="flex items-center gap-3.5 min-w-0">
                            <div class="w-11 h-11 rounded-2xl flex items-center justify-center shrink-0 ${meta.color}">
                                <i class="fa-solid ${meta.icon} text-sm"></i>
                            </div>
                            <div class="min-w-0">
                                <p class="text-xs font-bold text-slate-900 dark:text-white truncate">${tx.catatan}</p>
                                <div class="flex items-center gap-1.5 mt-1">
                                    <span class="text-[10px] font-semibold px-2 py-0.5 rounded-md bg-white dark:bg-slate-800 text-slate-600 dark:text-slate-300 border border-slate-200/60 dark:border-slate-700">
                                        ${tx.kategori}
                                    </span>
                                    <span class="text-[11px] text-slate-400">&bull; ${formatDate(tx.tanggal)}</span>
                                </div>
                            </div>
                        </div>

                        <div class="flex items-center gap-2 shrink-0">
                            <span class="text-xs sm:text-sm font-extrabold ${amountColor} mr-1">${sign} ${formatRupiah(tx.nominal)}</span>
                            <button onclick="editTransaction(${tx.id})" class="w-7 h-7 rounded-lg text-slate-400 hover:text-indigo-600 hover:bg-indigo-50 dark:hover:bg-indigo-500/10 transition flex items-center justify-center cursor-pointer" title="Edit">
                                <i class="fa-solid fa-pen text-[11px]"></i>
                            </button>
                            <button onclick="deleteTransaction(${tx.id})" class="w-7 h-7 rounded-lg text-slate-400 hover:text-rose-500 hover:bg-rose-50 dark:hover:bg-rose-500/10 transition flex items-center justify-center cursor-pointer" title="Hapus">
                                <i class="fa-solid fa-trash-can text-[11px]"></i>
                            </button>
                        </div>
                    </div>
                `;
            }).join('');
        }

        // Ekspor Data (Backup)
        function exportData() {
            if (transactions.length === 0) {
                showToast('Belum ada transaksi untuk di-backup!', 'error');
                return;
            }
            const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(transactions, null, 2));
            const downloadAnchor = document.createElement('a');
            downloadAnchor.setAttribute("href", dataStr);
            downloadAnchor.setAttribute("download", "backup_dompetku_" + new Date().toISOString().slice(0,10) + ".json");
            document.body.appendChild(downloadAnchor);
            downloadAnchor.click();
            downloadAnchor.remove();
            showToast('File backup JSON berhasil diunduh!');
        }

        // Impor Data (Restore)
        function importData(event) {
            const file = event.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(e) {
                try {
                    const importedData = JSON.parse(e.target.result);
                    if (Array.isArray(importedData)) {
                        if (confirm('Impor data ini? Data saat ini di browser akan digantikan dengan data dari file.')) {
                            transactions = importedData;
                            saveAndRender();
                            showToast('Data berhasil diimpor!');
                        }
                    } else {
                        showToast('Format file JSON tidak valid!', 'error');
                    }
                } catch (err) {
                    showToast('Gagal membaca file JSON.', 'error');
                }
            };
            reader.readAsText(file);
            event.target.value = '';
        }

        // Init pertama kali
        initYearFilter();
        renderApp();
    
    </script>
</body>
</html>
